[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-sql-grpo"
version = "0.1.0"
description = "Text-to-SQL post-training with GRPO on Spider (Qwen2.5-3B + QLoRA)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abhishek Manoj Sutaria" }]
keywords = ["text-to-sql", "grpo", "rl", "spider", "qlora", "trl"]
dependencies = [
  "torch>=2.2.0",
  "transformers>=4.46.0",
  "datasets>=3.0.0",
  "accelerate>=0.34.0",
  "peft>=0.13.0",
  "trl>=0.12.0",
  "bitsandbytes>=0.44.0; platform_system != 'Darwin' or platform_machine != 'arm64'",
  "sentencepiece>=0.2.0",
  "protobuf>=4.25.0",
  "sqlglot>=25.0.0",
  "pyyaml>=6.0",
  "tqdm>=4.66.0",
  "gradio>=4.44.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6.0"]

[project.scripts]
tts-prepare = "text_to_sql_grpo.cli:prepare_main"
tts-eval = "text_to_sql_grpo.cli:eval_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
