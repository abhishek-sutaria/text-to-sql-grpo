# Lean full GRPO — overnight run on 1× RTX 4090 (~4.5 h after resume).
# 3000 prompts × 4 generations, QLoRA from lean SFT adapter.
# Matches docs/grpo-results.md / results/MEASURED_RESULTS.md.

seed: 42
output_dir: outputs/full_grpo

model:
  name: Qwen/Qwen2.5-3B-Instruct
  load_in_4bit: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05

data:
  train_file: data/processed/train.jsonl
  max_samples: 3000

sft_adapter: outputs/full_sft/adapter

reward_weights:
  validity: 0.2
  execution: 0.3
  correctness: 0.5

train:
  batch_size: 4
  grad_accum: 4
  lr: 5.0e-7
  epochs: 1
  max_steps: -1
  logging_steps: 5
  save_steps: 100
  num_generations: 4       # G=4 rollouts per prompt
  max_completion_length: 160
  max_prompt_length: 896
  temperature: 0.7
  gradient_checkpointing: true
  bf16: true
  fp16: false
  report_to: none
