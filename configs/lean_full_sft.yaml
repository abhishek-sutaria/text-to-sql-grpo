# Lean full SFT — overnight run on 1× RTX 4090 (~66 min).
# Full 8659 Spider train rows, 1 epoch, QLoRA r=16/α=32, 4-bit.
# Matches docs/grpo-results.md / results/MEASURED_RESULTS.md.

seed: 42
output_dir: outputs/full_sft

model:
  name: Qwen/Qwen2.5-3B-Instruct
  load_in_4bit: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  train_file: data/processed/train.jsonl
  max_samples: null

train:
  batch_size: 1
  grad_accum: 16          # effective batch 16
  lr: 1.0e-4
  epochs: 1
  max_steps: -1
  logging_steps: 10
  save_steps: 200
  max_seq_length: 1024
  gradient_checkpointing: true
  bf16: true
  fp16: false
  report_to: none
